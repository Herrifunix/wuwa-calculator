<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WuWa – Calculateur de vœux et coraux</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #151923;
    --text: #e9ecf3;
    --muted: #aab1c3;
    --green: #37d67a;
    --border: #232835;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  .wrap {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }
  h1 {
    font-size: 24px;
  }
  .inputs {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 14px;
    color: var(--muted);
  }
  input {
    background: #0d111a;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 10px;
    border-radius: 6px;
    width: 120px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
  }
  td.seq {
    text-align: left;
    color: var(--text);
  }
  .status-box {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 6px;
    background: #0d111a;
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 500;
    min-width: 60px;
    text-align: center;
  }
  .status-box.reachable {
    background: var(--green);
    border-color: #1b1f2b;
    box-shadow: 0 0 10px rgba(55,214,122,0.3);
    color: #0d111a;
  }
  .status-box.unreachable {
    background: #2a1f1f;
    border-color: #4a2a2a;
    color: #ff6b6b;
  }
  .tables-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .table-section {
    flex: 1;
    min-width: 400px;
  }
  .table-section h2 {
    font-size: 20px;
    margin-bottom: 15px;
  }
  .table-section .inputs {
    margin-bottom: 15px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wuthering Waves – Calculateur de vœux et coraux</h1>
  <p>Entrez vos ressources pour voir combien de séquences vous pouvez atteindre. Les cases s'allument automatiquement selon vos vœux et coraux.</p>
  
  <div class="tables-container">
    <div class="table-section">
      <h2>Personnage</h2>
      <div class="inputs">
        <div>
          <label for="astrite">Astrite</label>
          <input id="astrite" type="number" value="0" min="0">
        </div>
        <div>
          <label for="voeux">Vœux actuels</label>
          <input id="voeux" type="number" value="0" min="0">
        </div>
        <div>
          <label for="pity">Pity actuelle</label>
          <input id="pity" type="number" value="0" min="0" max="80">
        </div>
        <div>
          <label for="coraux">Coraux</label>
          <input id="coraux" type="number" value="0" min="0">
        </div>
        <div>
          <label>Total vœux</label>
          <div id="total-voeux" style="padding: 8px 10px; background: #0d111a; border: 1px solid var(--border); border-radius: 6px; color: var(--green); font-weight: bold; width: 120px;">0</div>
        </div>
        <div>
          <label style="display: flex; align-items: center;">
            <input id="garanti" type="checkbox">
            <span style="margin-left: 5px;">Garanti</span>
          </label>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Séquence</th>
            <th>Worst</th>
            <th>Lose 50/50</th>
            <th>Win 50/50</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="table-section">
      <h2>Arme R5</h2>
      <div class="inputs">
        <div>
          <label for="voeux-arme">Vœux arme</label>
          <input id="voeux-arme" type="number" value="0" min="0">
        </div>
        <div>
          <label for="pity-arme">Pity arme</label>
          <input id="pity-arme" type="number" value="0" min="0" max="80">
        </div>
        <div>
          <label>Total vœux arme</label>
          <div id="total-voeux-arme" style="padding: 8px 10px; background: #0d111a; border: 1px solid var(--border); border-radius: 6px; color: var(--green); font-weight: bold; width: 120px;">0</div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Rang</th>
            <th>Vœux requis</th>
          </tr>
        </thead>
        <tbody id="arme-table-body"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const data = [
  { seq: '0 [Just the character]', worst: 160, lose: 160, win: 80 },
  { seq: '1', worst: 320, lose: 240, win: 160 },
  { seq: '2', worst: 480, lose: 400, win: 240 },
  { seq: '3', worst: 640, lose: 480, win: 320 },
  { seq: '4', worst: 800, lose: 640, win: 400 },
  { seq: '5', worst: 960, lose: 720, win: 480 },
  { seq: '6', worst: 1120, lose: 800, win: 560 }
];

const armeData = [
  { rang: 'R1', pulls: 80 },
  { rang: 'R2', pulls: 160 },
  { rang: 'R3', pulls: 240 },
  { rang: 'R4', pulls: 320 },
  { rang: 'R5', pulls: 400 }
];

const tbody = document.getElementById('table-body');
const armeTableBody = document.getElementById('arme-table-body');
const astriteInput = document.getElementById('astrite');
const voeuxInput = document.getElementById('voeux');
const pityInput = document.getElementById('pity');
const corauxInput = document.getElementById('coraux');
const garantiInput = document.getElementById('garanti');
const voeuxArmeInput = document.getElementById('voeux-arme');
const pityArmeInput = document.getElementById('pity-arme');
const totalVoeuxDisplay = document.getElementById('total-voeux');
const totalVoeuxArmeDisplay = document.getElementById('total-voeux-arme');

// Charger les valeurs sauvegardées au démarrage
function loadSavedValues() {
  const savedAstrite = localStorage.getItem('wuwa-astrite');
  const savedVoeux = localStorage.getItem('wuwa-voeux');
  const savedPity = localStorage.getItem('wuwa-pity');
  const savedCoraux = localStorage.getItem('wuwa-coraux');
  const savedGaranti = localStorage.getItem('wuwa-garanti');
  const savedVoeuxArme = localStorage.getItem('wuwa-voeux-arme');
  const savedPityArme = localStorage.getItem('wuwa-pity-arme');
  
  if (savedAstrite !== null) astriteInput.value = savedAstrite;
  if (savedVoeux !== null) voeuxInput.value = savedVoeux;
  if (savedPity !== null) pityInput.value = savedPity;
  if (savedCoraux !== null) corauxInput.value = savedCoraux;
  if (savedGaranti !== null) garantiInput.checked = (savedGaranti === 'true');
  if (savedVoeuxArme !== null) voeuxArmeInput.value = savedVoeuxArme;
  if (savedPityArme !== null) pityArmeInput.value = savedPityArme;
}

// Sauvegarder les valeurs
function saveValues() {
  localStorage.setItem('wuwa-astrite', astriteInput.value);
  localStorage.setItem('wuwa-voeux', voeuxInput.value);
  localStorage.setItem('wuwa-pity', pityInput.value);
  localStorage.setItem('wuwa-coraux', corauxInput.value);
  localStorage.setItem('wuwa-garanti', garantiInput.checked);
  localStorage.setItem('wuwa-voeux-arme', voeuxArmeInput.value);
  localStorage.setItem('wuwa-pity-arme', pityArmeInput.value);
}

function bonusFromCoraux(coraux) {
  // Les coraux donnent des séquences directes
  if (coraux >= 720) return 2; // 2 séquences complètes
  if (coraux >= 360) return 1; // 1 séquence complète
  return 0;
}

function renderArme() {
  const voeuxArme = parseFloat(voeuxArmeInput.value) || 0;
  const pityArme = parseFloat(pityArmeInput.value) || 0;
  const totalVoeuxArme = voeuxArme + pityArme;

  // Sauvegarder les valeurs
  saveValues();

  // Mettre à jour l'affichage du total arme
  totalVoeuxArmeDisplay.textContent = Math.floor(totalVoeuxArme);

  armeTableBody.innerHTML = '';

  armeData.forEach((row, i) => {
    const tr = document.createElement('tr');
    const tdRang = document.createElement('td');
    tdRang.className = 'seq';
    tdRang.textContent = row.rang;

    const tdStatus = document.createElement('td');
    const box = document.createElement('div');
    box.className = 'status-box';

    // Chaque rang coûte 80 pulls garantis (pity 80)
    const requiredPulls = row.pulls;
    const voeuxNeeded = Math.max(0, requiredPulls - totalVoeuxArme);

    if (totalVoeuxArme >= requiredPulls) {
      box.classList.add('reachable');
      box.textContent = '✓';
    } else {
      box.classList.add('unreachable');
      box.textContent = Math.ceil(voeuxNeeded);
    }

    tdStatus.appendChild(box);
    tr.appendChild(tdRang);
    tr.appendChild(tdStatus);
    armeTableBody.appendChild(tr);
  });
}

function render() {
  const astrite = parseFloat(astriteInput.value) || 0;
  const voeux = parseFloat(voeuxInput.value) || 0;
  const pity = parseFloat(pityInput.value) || 0;
  const coraux = parseFloat(corauxInput.value) || 0;
  const garanti = garantiInput.checked;
  const totalVoeux = voeux + astrite / 160;
  const bonusSequences = bonusFromCoraux(coraux);

  // Sauvegarder les valeurs à chaque changement
  saveValues();

  // Mettre à jour l'affichage du total (vœux + pity + indication séquences coraux)
  let displayText = Math.floor(totalVoeux + pity);
  if (bonusSequences > 0) {
    displayText += ` (+${bonusSequences} seq)`;
  }
  totalVoeuxDisplay.textContent = displayText;

  tbody.innerHTML = '';

  data.forEach((row, i) => {
    const tr = document.createElement('tr');
    const tdSeq = document.createElement('td');
    tdSeq.className = 'seq';
    tdSeq.textContent = row.seq;

    const tdWorst = document.createElement('td');
    const tdLose = document.createElement('td');
    const tdWin = document.createElement('td');

    tdWorst.appendChild(makeStatusBox(row.worst, totalVoeux, pity, bonusSequences, i, 'worst', garanti));
    tdLose.appendChild(makeStatusBox(row.lose, totalVoeux, pity, bonusSequences, i, 'lose', garanti));
    tdWin.appendChild(makeStatusBox(row.win, totalVoeux, pity, bonusSequences, i, 'win', garanti));

    tr.appendChild(tdSeq);
    tr.appendChild(tdWorst);
    tr.appendChild(tdLose);
    tr.appendChild(tdWin);

    tbody.appendChild(tr);
  });
}

function makeStatusBox(requiredPulls, totalVoeux, pity, bonusSequences, sequenceIndex, scenario, garanti) {
  const box = document.createElement('div');
  box.className = 'status-box';
  
  // Calculer le coût cumulatif avec le garanti
  let adjustedRequiredPulls = requiredPulls;
  if (garanti) {
    // Si garanti est actif, on recalcule les coûts cumulatifs
    let cumulativeCost = 0;
    for (let i = 0; i <= sequenceIndex; i++) {
      if (i === 0) {
        // S0 avec garanti = 80 pulls (1 seul pity garanti) dans tous les cas
        cumulativeCost += 80;
      } else {
        // Après S0, on repart sur un 50/50 incertain
        let costForThisSeq;
        switch(scenario) {
          case 'worst':
            // Worst: on assume perdre tous les 50/50 = 160 pulls par séquence (80 perdu + 80 garanti)
            costForThisSeq = 160;
            break;
          case 'lose':
            // Lose 50/50: on alterne gagner/perdre les 50/50
            // Après S0 (garanti utilisé), on recommence sur 50/50
            // Séquences impaires (S1, S3, S5...): on perd le 50/50 = 160 pulls (80 + 80)
            // Séquences paires (S2, S4, S6...): on gagne le 50/50 = 80 pulls
            if (i % 2 === 1) {
              // Séquences impaires: on perd le 50/50
              costForThisSeq = 160;
            } else {
              // Séquences paires: on gagne le 50/50
              costForThisSeq = 80;
            }
            break;
          case 'win':
            // Win: on gagne tous les 50/50 = 80 pulls par séquence
            costForThisSeq = 80;
            break;
        }
        cumulativeCost += costForThisSeq;
      }
    }
    adjustedRequiredPulls = cumulativeCost;
  }
  
  // La pity réduit le coût de TOUTES les séquences (comme les vœux actuels)
  adjustedRequiredPulls = Math.max(0, adjustedRequiredPulls - pity);
  const totalVoeuxWithPity = totalVoeux + pity;
  
  // Calculer combien de séquences on peut déjà atteindre avec nos vœux + pity
  let sequencesFromVoeux = 0;
  for (let i = 0; i < data.length; i++) {
    let requiredForThisSeq;
    
    if (garanti) {
      // Recalculer le coût cumulatif pour cette séquence
      let cumulative = 0;
      for (let j = 0; j <= i; j++) {
        if (j === 0) {
          cumulative += 80; // S0 garanti = 80 dans tous les cas
        } else {
          switch(scenario) {
            case 'worst': 
              cumulative += 160;
              break;
            case 'lose':
              // Alterner: S1 perd (160), S2 gagne (80), S3 perd (160), etc.
              cumulative += (j % 2 === 1) ? 160 : 80;
              break;
            case 'win': 
              cumulative += 80;
              break;
          }
        }
      }
      requiredForThisSeq = cumulative;
    } else {
      // Utiliser les valeurs normales du tableau
      switch(scenario) {
        case 'worst': requiredForThisSeq = data[i].worst; break;
        case 'lose': requiredForThisSeq = data[i].lose; break;
        case 'win': requiredForThisSeq = data[i].win; break;
      }
    }
    
    if (totalVoeuxWithPity >= requiredForThisSeq) {
      sequencesFromVoeux = i + 1;
    } else {
      break;
    }
  }
  
  // Les coraux donnent des séquences SUPPLÉMENTAIRES après celles des vœux
  const totalSequencesAvailable = sequencesFromVoeux + bonusSequences;
  
  if (sequenceIndex < sequencesFromVoeux) {
    // Accessible avec vos vœux + pity
    box.classList.add('reachable');
    box.textContent = '✓';
  } else if (sequenceIndex < totalSequencesAvailable) {
    // Accessible grâce aux coraux (séquence supplémentaire)
    box.classList.add('reachable');
    box.textContent = '★';
    box.title = 'Séquence supplémentaire grâce aux coraux';
  } else {
    // Pas encore accessible - calculer les vœux manquants
    const voeuxNeeded = Math.max(0, adjustedRequiredPulls - totalVoeux);
    box.classList.add('unreachable');
    box.textContent = Math.ceil(voeuxNeeded);
  }
  
  return box;
}

[astriteInput, voeuxInput, pityInput, corauxInput].forEach(el => el.addEventListener('input', render));
garantiInput.addEventListener('change', render);

[voeuxArmeInput, pityArmeInput].forEach(el => el.addEventListener('input', renderArme));

// Charger les valeurs sauvegardées au démarrage
loadSavedValues();
render();
renderArme();
</script>
</body>
</html>
